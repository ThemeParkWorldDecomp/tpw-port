# TPI targeted tests: builds the tree exactly as build.yml does on every runner kind build.yml uses, then runs ONLY the
# TPI tests (ctest selection below) N times in a row (input "runs", default 10). Nothing else: no icon, offline, update
# or artifact steps, no Flatpak, no installer.
#
# Round c (ci-tpi-10x-c): the selection is tpi_island, tpi_island_ring and tpi_convert (their final forms).
# For a THROWAWAY BRANCH only (CLAUDE.md: a new test runs alone on CI first, then 10 or more times in a row on every
# runner kind, all green, before it joins the full CI). Push the branch to tpw-port with build.yml, installer.yml and
# installer-broad.yml removed from it, then:  gh workflow run tpi-targeted.yml --ref <branch> -f runs=10
# This file never goes to main. Each job prints "TPI targeted: N of N runs green" and fails on any red run.
# GitHub registers a workflow that is not on the default branch only when a push event on that branch names it, so the
# push of the throwaway branch is also run 1 (one run of the selection); later dispatches set runs=10.
name: TPI targeted tests

on:
  push:
    branches: ['ci-tpi-10x-*']
  workflow_dispatch:
    inputs:
      runs:
        description: 'How many times to run the TPI tests on each runner'
        required: false
        default: '10'
        type: string
      selection:
        description: 'ctest -R pattern of the tests to run (the TPI tests; platform holds TestTpiContent, launcher_ui the TpiWorlds rows, assets and importer the disc recogniser)'
        required: false
        default: '^(tpi_island|tpi_island_ring|tpi_convert)$'
        type: string

permissions:
  contents: read

env:
  # On a push there are no inputs: one run of the default selection.
  TPI_RUNS: ${{ inputs.runs || '1' }}
  TPI_SELECTION: ${{ inputs.selection || '^(tpi_island|tpi_island_ring|tpi_convert)$' }}

jobs:
  windows:
    strategy:
      fail-fast: false   # one image failing must not hide the other's result
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    # launcher_ui alone takes about 10 min on these runners (first run 2026-11-11): 10 runs plus the build need about 2 h
    timeout-minutes: 180
    steps:
      - name: Keep line endings as stored
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the launcher (Command Prompt)
        shell: cmd
        run: build.cmd TOOLS=fetch
      - name: Build the tests
        shell: pwsh
        run: |
          # The tools build.cmd fetched into build\tools (devtools\win\build.ps1: llvm-mingw, cmake, ninja, python), first on
          # the PATH as build.ps1 puts them for its own steps.
          $tools = Join-Path $pwd 'build\tools'
          $env:PATH = "$tools\llvm-mingw\bin;$tools\cmake\bin;$tools\ninja;$tools\python;$env:PATH"
          & "$tools\cmake\bin\cmake.exe" --build build
          if ($LASTEXITCODE -ne 0) { throw "cmake --build build exited with $LASTEXITCODE" }
      - name: Run the TPI tests N times
        shell: pwsh
        run: |
          $tools = Join-Path $pwd 'build\tools'
          $env:PATH = "$tools\llvm-mingw\bin;$tools\cmake\bin;$tools\ninja;$tools\python;$env:PATH"
          $ctest = "$tools\cmake\bin\ctest.exe"
          $n = [int]$env:TPI_RUNS
          $sel = $env:TPI_SELECTION
          $list = & $ctest --test-dir build -N -R $sel
          $list | Write-Output
          $m = $list | Select-String '^Total Tests: (\d+)'
          if (-not $m -or [int]$m.Matches[0].Groups[1].Value -lt 1) { throw "no test matches $sel (Windows builds have no libclang, so the slicer-built tests do not exist here)" }
          $fail = 0
          for ($i = 1; $i -le $n; $i++) {
            Write-Output "::group::run $($i) of $($n)"
            & $ctest --test-dir build -R $sel --output-on-failure
            if ($LASTEXITCODE -ne 0) { $fail++; Write-Output "run $($i): FAIL" } else { Write-Output "run $($i): pass" }
            Write-Output "::endgroup::"
          }
          Write-Output "TPI targeted: $($n - $fail) of $($n) runs green"
          if ($fail -ne 0) { exit 1 }

  windows-arm:
    runs-on: windows-11-arm
    continue-on-error: true   # advisory, as in build.yml (x86-64 tools under emulation)
    timeout-minutes: 300      # launcher_ui takes about 20 min under emulation
    steps:
      - name: Keep line endings as stored
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the launcher (Command Prompt)
        shell: cmd
        run: build.cmd TOOLS=fetch
      - name: Build the tests
        shell: pwsh
        run: |
          $tools = Join-Path $pwd 'build\tools'
          $env:PATH = "$tools\llvm-mingw\bin;$tools\cmake\bin;$tools\ninja;$tools\python;$env:PATH"
          & "$tools\cmake\bin\cmake.exe" --build build
          if ($LASTEXITCODE -ne 0) { throw "cmake --build build exited with $LASTEXITCODE" }
      - name: Run the TPI tests N times
        shell: pwsh
        run: |
          $tools = Join-Path $pwd 'build\tools'
          $env:PATH = "$tools\llvm-mingw\bin;$tools\cmake\bin;$tools\ninja;$tools\python;$env:PATH"
          $ctest = "$tools\cmake\bin\ctest.exe"
          $n = [int]$env:TPI_RUNS
          $sel = $env:TPI_SELECTION
          $list = & $ctest --test-dir build -N -R $sel
          $list | Write-Output
          $m = $list | Select-String '^Total Tests: (\d+)'
          if (-not $m -or [int]$m.Matches[0].Groups[1].Value -lt 1) { throw "no test matches $sel" }
          $fail = 0
          for ($i = 1; $i -le $n; $i++) {
            Write-Output "::group::run $($i) of $($n)"
            & $ctest --test-dir build -R $sel --output-on-failure
            if ($LASTEXITCODE -ne 0) { $fail++; Write-Output "run $($i): FAIL" } else { Write-Output "run $($i): pass" }
            Write-Output "::endgroup::"
          }
          Write-Output "TPI targeted: $($n - $fail) of $($n) runs green"
          if ($fail -ne 0) { exit 1 }

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the build's packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 git \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev \
            xvfb mesa-vulkan-drivers libvulkan1 glslang-tools libclang-18-dev
      - name: Build the launcher
        run: |
          mkdir -p build/logs
          set -o pipefail
          ok=0
          cmake -S . -B build -G Ninja 2>&1 | tee build/logs/configure.log || ok=1
          if [ $ok = 0 ]; then cmake --build build --target tpw_launcher 2>&1 | tee build/logs/build.log || ok=1; fi
          if [ $ok != 0 ]; then
            grep -hE 'error|Error|FAILED' build/logs/configure.log build/logs/build.log 2>/dev/null | tail -n 40 | sed 's/^/::error::/'
            exit 1
          fi
          grep -m 5 'tpw: mod' build/logs/configure.log || echo '::warning::no "tpw: mod" line: the mods/ submodule has no mod with a mods.cmake entry'
      - name: Build the tests
        run: cmake --build build
      - name: Run the TPI tests N times
        env:
          SDL_AUDIO_DRIVER: dummy   # the runner has no sound device
        run: |
          n="${TPI_RUNS:-10}"
          sel="$TPI_SELECTION"
          ctest --test-dir build -N -R "$sel"
          count=$(ctest --test-dir build -N -R "$sel" | sed -n 's/^Total Tests: //p')
          [ "${count:-0}" -gt 0 ] || { echo "::error::no test matches $sel"; exit 1; }
          fail=0
          for i in $(seq 1 "$n"); do
            echo "::group::run $i of $n"
            if xvfb-run -a -s "-screen 0 1280x800x24" ctest --test-dir build -R "$sel" --output-on-failure; then
              echo "run $i: pass"
            else
              echo "run $i: FAIL"; fail=$((fail + 1))
            fi
            echo "::endgroup::"
          done
          echo "TPI targeted: $((n - fail)) of $n runs green"
          [ "$fail" -eq 0 ]

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240      # launcher_ui takes about 14 min on the Intel runner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the launcher
        run: make
      - name: Build the tests
        run: |
          # The CMake the Makefile chose: the one it fetched into build/cmake when the Mac had none, else the PATH's.
          CMAKE=cmake
          [ -x build/cmake/CMake.app/Contents/bin/cmake ] && CMAKE=build/cmake/CMake.app/Contents/bin/cmake
          echo "cmake: $CMAKE ($("$CMAKE" --version | head -n 1))"
          unset MAKEFLAGS MFLAGS   # the Makefile does the same (CLEAN_ENV) before calling CMake
          "$CMAKE" --build build
      - name: Run the TPI tests N times
        run: |
          CTEST=ctest
          [ -x build/cmake/CMake.app/Contents/bin/ctest ] && CTEST=build/cmake/CMake.app/Contents/bin/ctest
          n="${TPI_RUNS:-10}"
          sel="$TPI_SELECTION"
          "$CTEST" --test-dir build -N -R "$sel"
          count=$("$CTEST" --test-dir build -N -R "$sel" | sed -n 's/^Total Tests: //p')
          [ "${count:-0}" -gt 0 ] || { echo "::error::no test matches $sel"; exit 1; }
          fail=0
          for i in $(seq 1 "$n"); do
            echo "::group::run $i of $n"
            if "$CTEST" --test-dir build -R "$sel" --output-on-failure; then
              echo "run $i: pass"
            else
              echo "run $i: FAIL"; fail=$((fail + 1))
            fi
            echo "::endgroup::"
          done
          echo "TPI targeted: $((n - fail)) of $n runs green"
          [ "$fail" -eq 0 ]
