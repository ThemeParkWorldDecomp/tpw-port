# Builds a release when its tag (vX.Y.Z) is pushed: the launcher for Windows x64 and for Macs with Apple Silicon and
# Intel processors, all from the one tagged commit, with the tests run first; then publishes them as the tag's GitHub
# Release. A release is never changed afterwards. A fix found later goes into the next version (CONTRIBUTING.md,
# Releases), so every report that names a version names one build of the code, the same on every system.
#
# The release also carries the one-line installers, install.sh and install.ps1 (they build the launcher from source on
# the player's computer). The one-liners download them from releases/latest, so the newest release always hands out
# the newest installer. After publishing, the stable branch is moved forward to the tag: stable is what players and
# `git clone --branch stable` get, main is the next version being made.
#
# Run by hand (Actions, release, Run workflow) it is a trial: the same builds, tests and downloads, kept as the run's
# artifacts, and nothing published.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag must name launcher/VERSION.txt's version, so a -dev version (main between releases) is never released. A
  # trial takes the version as it is.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag names launcher/VERSION.txt's version
        id: version
        run: |
          version=$(head -n 1 launcher/VERSION.txt | tr -d '\r')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not name launcher/VERSION.txt's version ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The release page opens with the version's section of CHANGELOG.md, the players' list of what changed
      # (CONTRIBUTING.md, The changelog). A release needs it dated; a trial takes it as it is, as a preview.
      - name: The version's changelog section
        run: |
          version=$(head -n 1 launcher/VERSION.txt | tr -d '\r'); number=${version%-dev}
          heading=$(grep -m 1 "^## $number " CHANGELOG.md || true)
          if [ "$GITHUB_EVENT_NAME" = push ] && ! printf '%s\n' "$heading" | grep -Eq "^## $number \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$"; then
            echo "::error::CHANGELOG.md has no dated section for $number (found: '$heading')"
            exit 1
          fi
          awk -v h="$heading" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md's section for $number is empty"
            exit 1
          fi
          cat changes.md
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changes.md
          if-no-files-found: error
      # The installers are run by players' computers straight from the release: at least they must parse.
      - name: The shell installer parses
        run: sh -n install.sh
      - name: The PowerShell installer parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; throw 'install.ps1 does not parse' }
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            install.sh
            install.ps1
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Keep line endings as stored
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the launcher and run the tests
        shell: cmd
        run: build.cmd TOOLS=fetch test
      - name: The launcher names its version
        shell: pwsh
        timeout-minutes: 2
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'version.txt'
          $p = Start-Process -FilePath build\tpw_launcher.exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "tpw_launcher.exe --version exited with $($p.ExitCode)" }
          if (-not (Select-String -LiteralPath $out -SimpleMatch -Pattern ' v${{ needs.check.outputs.version }}' -Quiet)) { throw 'the launcher does not name the release version' }
      - name: Pack the launcher
        shell: pwsh
        run: |
          $dir = 'STP-TPW-Launcher-${{ needs.check.outputs.version }}-windows-x64'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item build\tpw_launcher.exe, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: STP-TPW-Launcher-*.zip
          if-no-files-found: error

  macos:
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the launcher and run the tests
        run: make && make test
      - name: The launcher names its version
        run: build/tpw_launcher --version | tee version.txt && grep -F ' v${{ needs.check.outputs.version }}' version.txt
      # A .tar.gz keeps the launcher's executable bit (a .zip from a browser download does not).
      - name: Pack the launcher
        run: |
          dir=STP-TPW-Launcher-${{ needs.check.outputs.version }}-macos-${{ matrix.arch }}
          mkdir "$dir" && cp build/tpw_launcher README.md "$dir"/
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: STP-TPW-Launcher-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [check, windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history, for the stable branch's fast-forward check below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd dist
          sha256sum STP-TPW-Launcher-* install.sh install.ps1 > SHA256SUMS.txt
          { sed -n '/[^[:space:]]/,$p' changes.md; printf '\n## Downloads\n\n'; } > notes.md
          cat >> notes.md <<EOF
          The STP/TPW Launcher $VERSION, built from the tag $GITHUB_REF_NAME. The Mac and Windows downloads are the same code.
          You need your own copy of the game: the launcher imports it from your discs.

          The easiest way to install it (run the same line again to update) is one line, which downloads the source
          and builds the launcher on your computer, so there are no security warnings to click through:

          - Mac (Terminal): \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh\`
          - Windows (PowerShell): \`irm https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex\`

          If you play from a clone of this repository, run the same line too: it leaves the clone alone (and says when it
          can go), and your games, saves and settings stay as they are. The README's Quick start says what each line
          needs. Or download a ready-made launcher:

          - Windows 10 or 11 (64-bit): STP-TPW-Launcher-$VERSION-windows-x64.zip. Unzip it and run tpw_launcher.exe. If
            Windows SmartScreen stops it, click More info, then Run anyway.
          - Mac with Apple Silicon: STP-TPW-Launcher-$VERSION-macos-arm64.tar.gz. With an Intel processor: the -macos-x64 one.
            Double-click it to unpack, then in Terminal run \`xattr -d com.apple.quarantine\` on the unpacked tpw_launcher
            (the launcher is not signed, so macOS blocks it otherwise) and start it.
          - To build it yourself: \`git clone --branch $GITHUB_REF_NAME --recurse-submodules https://github.com/$GITHUB_REPOSITORY.git\`,
            then the README's Quick start.

          Reporting a problem: say that you run $VERSION (the About box and the log file's first line show it), your
          system and your edition, attach the launcher's newest log and say what you clicked before it went wrong.
          EOF
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "STP/TPW Launcher $VERSION" \
            --notes-file notes.md STP-TPW-Launcher-* install.sh install.ps1 SHA256SUMS.txt
      # stable follows the releases: moved to each new tag, created by the first. A plain push (no force) is refused when
      # it is not a fast-forward, so stable never goes back and never loses a commit; the check first says why in words.
      - name: Move the stable branch to the release
        run: |
          commit=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          if git ls-remote --exit-code --heads origin stable > /dev/null; then
            git fetch --no-tags origin '+refs/heads/stable:refs/remotes/origin/stable'
            if ! git merge-base --is-ancestor refs/remotes/origin/stable "$commit"; then
              echo "::error::stable has commits that $GITHUB_REF_NAME does not; it was not moved (the release is published)"
              exit 1
            fi
          fi
          git push origin "$commit:refs/heads/stable"
