# Builds the port on every push and pull request: on Windows with build.cmd, the same command a tester runs (every tool
# fetched into build\tools\, nothing preinstalled used), on an Apple Silicon Mac with make, and on Ubuntu with the
# README's Linux steps; then runs the tests each build has. The launcher each job builds is kept as the run's artifact
# (on Linux also the Flatpak bundle the linux job makes with devtools/flatpak.sh, the file a release hands out).
#
# GitHub has no Windows 10 or 11 desktop images. The nearest are its server images: windows-2022 (build 20348, the
# Windows 10 era's server release) and windows-2025 (build 26100, the same build as Windows 11 24H2; windows-latest).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or pull request) cancels the run still going for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The "playable offline" rule (CONTRIBUTING.md): no network code outside launcher/net/. A static read of the sources,
  # so any runner does; the tests and the launcher also run with the network blocked on the Macs (the macos job) and on
  # Linux (the linux job). Windows has no switch a step can use to block one program's network (its firewall rules need
  # the program installed first and apply to the whole runner), so its jobs do not.
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: No network code outside launcher/net
        run: python3 -I devtools/check_offline.py

  # The "no game data" rule (CONTRIBUTING.md, "Before a pull request"): the repository never holds the game's files, a
  # link to them, or what names a particular download. A pull request fails when it adds an item or download link of the
  # Internet Archive, a web address ending in a disc image, a magnet or torrent link, a file host's share link, a disc
  # image's file name, an MD5, a long hash beside a disc or download, a Redump id, a game-download site's name or an item
  # title, or a commit message with one. A push to a branch checks every tracked file. A static read, so any
  # runner does; the patterns and what they allow are at the top of devtools/check_no_game_data.py.
  no-game-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The patterns still catch and still allow what they should
        run: python3 -I devtools/check_no_game_data.py --self-test
      - name: A pull request adds no link to the game's files
        if: github.event_name == 'pull_request'
        run: python3 -I devtools/check_no_game_data.py --base "${{ github.event.pull_request.base.sha }}"
      - name: No tracked file holds a link to the game's files
        if: github.event_name != 'pull_request'
        run: python3 -I devtools/check_no_game_data.py --tree

  windows:
    strategy:
      fail-fast: false   # one image failing must not hide the other's result
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # The files keep the line endings they are stored with, as in the README's clone; .gitattributes still gives the
      # .cmd files CRLF.
      - name: Keep line endings as stored
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The platform tests' sources are cut by the slicer, which runs on libclang, and llvm-mingw ships none: the
      # libclang.dll of the LLVM release of llvm-mingw's clang, x86-64 (build.ps1's Python is x86-64 on every runner,
      # emulated on Arm), cached by version and checked against the release asset's SHA-256. CMake reads TPW_LIBCLANG.
      - name: Cache libclang
        id: libclang
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\libclang
          key: libclang-23.1.3-x86_64-pc-windows-msvc
      - name: Fetch libclang
        if: steps.libclang.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'clang+llvm-23.1.3-x86_64-pc-windows-msvc'
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/$name.tar.zst"
          $sha = '7e69dc07a4536b79ff24a651a2611990bf8eaab17ea560f1092707c4f31ba01d'
          $zst = Join-Path $env:RUNNER_TEMP "$name.tar.zst"
          $dir = Join-Path $env:RUNNER_TEMP 'libclang'
          # curl retries a failed transfer itself; a whole new download follows a wrong hash, up to three in all.
          for ($try = 1; ; $try++) {
            & curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o $zst $url
            if ($LASTEXITCODE -eq 0 -and (Get-FileHash -Algorithm SHA256 $zst).Hash -eq $sha) { break }
            if ($try -ge 3) { throw "libclang: $url failed or did not match its SHA-256, $try times" }
            Write-Host "libclang: download $try failed (curl $LASTEXITCODE), again"
            Start-Sleep -Seconds 20
          }
          # windows-2022's tar.exe reads no zstd, so the runner's zstd decompresses it (the archive is made with a 1 GB
          # window: --long=31); cmd's pipe keeps the bytes.
          $zstd = (Get-Command zstd.exe -ErrorAction SilentlyContinue).Source
          if (-not $zstd) { $zstd = 'C:\tools\zstd\zstd.exe' }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          & cmd /c "`"$zstd`" -dc --long=31 `"$zst`" | tar.exe -xf - -C `"$dir`" --strip-components 2 $name/bin/libclang.dll"
          if ($LASTEXITCODE) { throw "libclang: extracting it failed ($LASTEXITCODE)" }
          Remove-Item -LiteralPath $zst
          Get-Item (Join-Path $dir 'libclang.dll') | Format-List FullName, Length
      - name: Name libclang for the build
        shell: pwsh
        run: |
          $dll = Join-Path $env:RUNNER_TEMP 'libclang\libclang.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "no $dll" }
          "TPW_LIBCLANG=$dll" >> $env:GITHUB_ENV
      # TOOLS=fetch: the runner has a CMake and a Python of its own, a tester's PC has neither.
      - name: Build the launcher (Command Prompt)
        shell: cmd
        run: build.cmd TOOLS=fetch
      # The launcher starts and answers --version (its name, version and build; exit 0) with no game files. It is a
      # Windows app, so Start-Process -Wait waits for it; with its output redirected it writes no log file.
      - name: Start the launcher (--version)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'standalone-launcher'
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          Copy-Item build\tpw_launcher.exe $isolated
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = Join-Path $env:RUNNER_TEMP 'version.txt'
          $err = Join-Path $env:RUNNER_TEMP 'version-err.txt'
          $p = Start-Process -FilePath (Join-Path $isolated 'tpw_launcher.exe') -ArgumentList '--version' -NoNewWindow -Wait -PassThru `
               -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err
          if ($p.ExitCode -ne 0) { throw "tpw_launcher.exe --version exited with $($p.ExitCode)" }
          if (-not (Select-String -LiteralPath $out -Pattern '^build: ' -Quiet)) { throw 'tpw_launcher.exe --version printed no build line' }
      # The launcher's file has an icon (the resource launcher.rc.in names, drawn at build time), and --write-icon writes
      # the same icon as a .ico that Windows reads (the install script makes the Start menu shortcut's icon from it).
      - name: The launcher's icon
        shell: pwsh
        timeout-minutes: 2
        run: |
          Add-Type -Namespace Tpw -Name Shell -MemberDefinition @'
          [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
          public static extern uint ExtractIconExW(string file, int index, IntPtr[] large, IntPtr[] small, uint count);
          '@
          $exe = (Resolve-Path build\tpw_launcher.exe).Path
          $icons = [Tpw.Shell]::ExtractIconExW($exe, -1, $null, $null, 0)
          Write-Host "tpw_launcher.exe has $icons icon(s)"
          if ($icons -lt 1) { throw 'tpw_launcher.exe has no icon resource' }
          $ico = Join-Path $env:RUNNER_TEMP 'launcher-icon.ico'
          $out = Join-Path $env:RUNNER_TEMP 'icon-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'icon-err.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--write-icon', "`"$ico`"" -NoNewWindow -Wait -PassThru `
               -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err
          if ($p.ExitCode -ne 0) { throw "tpw_launcher.exe --write-icon exited with $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath $ico)) { throw "--write-icon wrote no $ico" }
          $bytes = [System.IO.File]::ReadAllBytes($ico)
          if ($bytes.Length -lt 22 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0 -or $bytes[4] -lt 1) {
            throw "$ico is not an icon file"
          }
          Write-Host "$ico`: $($bytes.Length) bytes, $($bytes[4]) picture(s)"
          Add-Type -AssemblyName System.Drawing
          $loaded = New-Object System.Drawing.Icon($ico, 256, 256)
          Write-Host "Windows reads it as $($loaded.Width)x$($loaded.Height)"
          if ($loaded.Width -lt 16) { throw 'Windows could not read the icon' }
          $loaded.Dispose()
      # UTF-8 is the process's code page (launcher/win/tpw_launcher.manifest; platform/path_text.h), in the launcher and in the
      # game's program, which is a copy of it. Both files hold the manifest, and both processes say 65001 in the log of a data
      # folder named in two alphabets, with no second folder beside it. Fails when the manifest goes, or when a resource
      # compiler is missing. --game-app-test needs no game, as in installer-ci/win.ps1.
      - name: The launcher's code page
        shell: pwsh
        timeout-minutes: 4
        run: |
          Add-Type -Namespace Tpw -Name Resources -MemberDefinition @'
          [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
          public static extern IntPtr LoadLibraryExW(string file, IntPtr none, uint flags);
          [DllImport("kernel32.dll", SetLastError = true)]
          public static extern IntPtr FindResourceW(IntPtr module, IntPtr name, IntPtr type);
          [DllImport("kernel32.dll")]
          public static extern uint SizeofResource(IntPtr module, IntPtr resource);
          [DllImport("kernel32.dll")]
          public static extern IntPtr LoadResource(IntPtr module, IntPtr resource);
          [DllImport("kernel32.dll")]
          public static extern IntPtr LockResource(IntPtr loaded);
          [DllImport("kernel32.dll")]
          public static extern bool FreeLibrary(IntPtr module);
          '@
          function Assert-Utf8Manifest([string]$file) {
            $module = [Tpw.Resources]::LoadLibraryExW($file, [IntPtr]::Zero, 0x22)   # as a data file and an image resource
            if ($module -eq [IntPtr]::Zero) { throw "cannot read the resources of $file" }
            $found = [Tpw.Resources]::FindResourceW($module, [IntPtr]1, [IntPtr]24)   # id 1, RT_MANIFEST
            if ($found -eq [IntPtr]::Zero) { throw "$file has no manifest" }
            $size = [Tpw.Resources]::SizeofResource($module, $found)
            $bytes = New-Object byte[] $size
            [Runtime.InteropServices.Marshal]::Copy([Tpw.Resources]::LockResource([Tpw.Resources]::LoadResource($module, $found)), $bytes, 0, $size)
            [void][Tpw.Resources]::FreeLibrary($module)
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            if ($text -notmatch '<activeCodePage[^>]*>\s*UTF-8\s*</activeCodePage>') { throw "$file has a manifest without the UTF-8 code page: $text" }
            Write-Host "$file`: the manifest sets UTF-8"
          }
          $exe = (Resolve-Path build\tpw_launcher.exe).Path
          Assert-Utf8Manifest $exe
          $parent = Join-Path $env:RUNNER_TEMP 'code-page'
          $name = "Jos$([char]0xE9) $([char]0x65E5)$([char]0x672C)"
          $data = Join-Path $parent $name
          [void](New-Item -ItemType Directory -Force -Path $data)
          $p = Start-Process -FilePath $exe -ArgumentList '--data', "`"$data`"", '--game-app-test', 'us', '--frames', '30' -WorkingDirectory (Split-Path -Parent $exe) -PassThru
          $log = Join-Path $data 'logs\launcher.log'
          $lines = @()
          foreach ($i in 1..60) {
            if (Test-Path -LiteralPath $log) { $lines = @(Select-String -LiteralPath $log -Encoding utf8 -Pattern 'windows: process code page \d+') }
            if ($lines.Count -ge 2) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Encoding utf8 }
          Get-Process -Name 'Sim Theme Park' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; Write-Host 'the launcher was still running' }
          if ($lines.Count -lt 2) { throw "the launcher's and the game's code page lines are not both in $log ($($lines.Count) found)" }
          foreach ($line in $lines) { if ($line.Line -notmatch 'process code page 65001\s*$') { throw "not the UTF-8 code page: $($line.Line)" } }
          $beside = @(Get-ChildItem -LiteralPath $parent -Force)
          if ($beside.Count -ne 1) { throw "a second data folder beside the real one: $($beside.Name -join ', ')" }
          $gameExe = Join-Path (Split-Path -Parent $exe) 'Sim Theme Park.exe'
          Assert-Utf8Manifest $gameExe
          Remove-Item -LiteralPath $gameExe -ErrorAction SilentlyContinue
      - name: Build and run the tests (PowerShell)
        shell: pwsh
        run: .\build.cmd TOOLS=fetch test
      - name: Keep the launcher
        uses: actions/upload-artifact@v4
        with:
          name: tpw_launcher-${{ matrix.os }}-x64
          path: build/tpw_launcher.exe
          if-no-files-found: error
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          path: build/logs/
          if-no-files-found: ignore

  # Advisory: Windows 11 on Arm. The same x86-64 toolchain and launcher, run under Windows' x64 emulation, so it is slow,
  # and a red run here does not fail the workflow. The steps are the windows job's.
