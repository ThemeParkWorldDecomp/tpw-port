      - name: Build and run the tests (PowerShell)
        shell: pwsh
        run: .\build.cmd TOOLS=fetch test
      - name: Keep the launcher
        uses: actions/upload-artifact@v4
        with:
          name: tpw_launcher-windows-11-arm-x64
          path: build/tpw_launcher.exe
          if-no-files-found: error
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-11-arm
          path: build/logs/
          if-no-files-found: ignore

  # Linux: the launcher built as the README's Linux steps build it (the distribution's GCC, CMake and Ninja, SDL's
  # development packages), the shaders checked against their sources, its tests and the renderer test under a virtual
  # screen with Mesa's software Vulkan and OpenGL, then the tests and the update check again with the network blocked
  # (unshare -n: no interface but the loopback). libclang-18-dev is for the platform tests' slicer, mesa-vulkan-drivers
  # and libvulkan1 for the renderer test (lavapipe and the loader), glslang-tools for the shader check. Then the launcher
  # as the Flatpak bundle, installed, started and installed again by install.sh --flatpak.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the build's packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 git \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev \
            xvfb mesa-vulkan-drivers libvulkan1 glslang-tools libclang-18-dev
      # Each step's output is kept in build/logs/ (the run's artifact when a step fails), and the error lines of a failed
      # build are also given as annotations, which the API lists for a machine that cannot fetch the runner's log.
      - name: Build the launcher
        run: |
          mkdir -p build/logs
          set -o pipefail
          ok=0
          cmake -S . -B build -G Ninja 2>&1 | tee build/logs/configure.log || ok=1
          if [ $ok = 0 ]; then cmake --build build --target tpw_launcher 2>&1 | tee build/logs/build.log || ok=1; fi
          if [ $ok != 0 ]; then
            grep -hE 'error|Error|FAILED' build/logs/configure.log build/logs/build.log 2>/dev/null | tail -n 40 | sed 's/^/::error::/'
            exit 1
          fi
      - name: Start the launcher (--version)
        run: |
          build/tpw_launcher --version
          # Only the system's C and C++ runtimes: no OpenGL, Vulkan, X11 or audio library is linked (SDL opens them at run time).
          ldd build/tpw_launcher
          ! ldd build/tpw_launcher | grep -E 'libGL|libvulkan|libX11|libwayland|libasound|libpulse'
      - name: The shaders' SPIR-V matches their sources
        run: sh devtools/vulkan_shaders.sh --check
      - name: Build and run the tests
        env:
          SDL_AUDIO_DRIVER: dummy   # the runner has no sound device
        run: |
          cmake --build build
          xvfb-run -a -s "-screen 0 1280x800x24" ctest --test-dir build --output-on-failure
      # The same tests with the network blocked for them and everything they start (a network namespace with no
      # interface but the loopback): the game, the launcher and their tests need no internet. Only unshare and the
      # loopback's ip run as root; the tests run as the runner's user, as in the step before.
      - name: Run the tests offline
        run: |
          sudo unshare -n sh -c 'ip link set lo up 2>/dev/null; exec sudo -u "$1" env PATH="$2" SDL_AUDIO_DRIVER=dummy xvfb-run -a -s "-screen 0 1280x800x24" ctest --test-dir build --output-on-failure' sh "$USER" "$PATH"
      - name: Check for updates offline (--check-updates)
        timeout-minutes: 2
        run: |
          out=$(sudo unshare -n sudo -u "$USER" env PATH="$PATH" build/tpw_launcher --check-updates)
          echo "$out"
          echo "$out" | grep -Eq '^answer: none \(.*\) after [0-4]\.[0-9] s$'
      # One file, build/tpw_launcher (the zip drops its executable bit: chmod +x after unzipping). It links only glibc
      # (the C++ runtime is linked in), so it runs on a distribution with a glibc as new as Ubuntu 24.04's.
      - name: Keep the launcher
        uses: actions/upload-artifact@v4
        with:
          name: tpw_launcher-linux-x86_64
          path: build/tpw_launcher
          if-no-files-found: error
      # The release's Linux download: the launcher as a Flatpak bundle (flatpak/, devtools/flatpak.sh), built against the
      # freedesktop SDK from Flathub, so that the one file installs on any distribution with Flatpak (install.sh
      # --flatpak installs it). The runtime and the SDK are cached between runs, under a key that changes with the
      # manifest, so a manifest that asks for another runtime (or a change to it) fetches it afresh.
      - name: Cache the Flatpak runtime
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-user-${{ runner.os }}-${{ hashFiles('flatpak/io.github.ThemeParkWorldDecomp.Launcher.yml') }}
      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils   # (eu-strip, for flatpak-builder's finish)
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the Flatpak bundle
        run: sh devtools/flatpak.sh
      - name: Install the bundle and start the launcher (--version)
        run: |
          flatpak install --user -y --noninteractive --bundle build/*.flatpak
          flatpak run io.github.ThemeParkWorldDecomp.Launcher --version | tee version.txt
          grep -F " v$(head -n 1 launcher/VERSION.txt | tr -d '\r')" version.txt
      # install.sh --flatpak, with the bundle just built in place of the release's download (TPW_INSTALL_BUNDLE) and a
      # home of its own for the themepark command (TPW_INSTALL_HOME): the command must then run the launcher.
      - name: install.sh --flatpak installs it and makes the themepark command
        run: |
          home=$RUNNER_TEMP/home; mkdir -p "$home"
          TPW_INSTALL_BUNDLE=$(ls build/*.flatpak) TPW_INSTALL_HOME=$home sh install.sh --flatpak --plain --no-launch | tee install.log
          tail -n 1 install.log | grep -E "^RESULT ok "
          "$home/.local/bin/themepark" --version | grep -F " v$(head -n 1 launcher/VERSION.txt | tr -d '\r')"
      - name: Keep the Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: tpw_launcher-linux-x86_64-flatpak
          path: build/*.flatpak
          if-no-files-found: error
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-ubuntu-24.04
          path: build/logs/
          if-no-files-found: ignore

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the launcher
        run: make
      - name: Start the launcher (--version)
        run: build/tpw_launcher --version
      - name: Build and run the tests
        run: make test
      # The same tests with the network blocked for them and everything they start (sandbox-exec, deny network*): the
      # game, the launcher and their tests need no internet.
      - name: Run the tests offline
        run: sandbox-exec -p '(version 1)(allow default)(deny network*)' make test
      # The launcher's update check with the network blocked: no answer, said at once (the check's own seconds, printed
      # on its answer line, under 5), and exit 0.
      - name: Check for updates offline (--check-updates)
        timeout-minutes: 2
        run: |
          out=$(sandbox-exec -p '(version 1)(allow default)(deny network*)' build/tpw_launcher --check-updates)
          echo "$out"
          echo "$out" | grep -Eq '^answer: none \(.*\) after [0-4]\.[0-9] s$'
      # One file, build/tpw_launcher (the zip drops its executable bit: chmod +x after unzipping).
      - name: Keep the launcher
        uses: actions/upload-artifact@v4
        with:
          name: tpw_launcher-${{ matrix.os }}-${{ matrix.arch }}
          path: build/tpw_launcher
          if-no-files-found: error
